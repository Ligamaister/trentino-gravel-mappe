    for(i=1;i<T.ele.length;i++)ctx.lineTo(X(cum[i]),Y(T.ele[i]));
    ctx.lineTo(X(TOT),H-PB);ctx.lineTo(X(0),H-PB);ctx.closePath();
    var g=ctx.createLinearGradient(0,PT,0,H-PB);
    g.addColorStop(0,COL+'55');g.addColorStop(1,COL+'0d');
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(X(0),Y(T.ele[0]));
    for(i=1;i<T.ele.length;i++)ctx.lineTo(X(cum[i]),Y(T.ele[i]));
    ctx.strokeStyle=COL;ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
  }
  function idxFromKm(km){
    var lo=0,hi=cum.length-1;
    while(lo<hi){var m=(lo+hi)>>1;if(cum[m]<km)lo=m+1;else hi=m}
    return lo;
  }
  function showAt(ix){
    draw();
    var x=X(cum[ix]),y=Y(T.ele[ix]);
    ctx.strokeStyle='#2a2320';ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,H-PB);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fillStyle='#1971c2';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
    tip.style.display='block';tip.style.left=x+'px';tip.style.top=y+'px';
    tip.textContent='km '+cum[ix].toFixed(1).replace('.',',')+' \u00b7 '+T.ele[ix]+' m';
    cur.setLatLng(ll[ix]);if(!map.hasLayer(cur))cur.addTo(map);
  }
  function hideCur(){draw();tip.style.display='none';if(map.hasLayer(cur))map.removeLayer(cur)}
  function profMove(clientX){
    var r=cv.getBoundingClientRect();
    var km=Math.max(0,Math.min(TOT,(clientX-r.left-PL)/(W-PL-PR)*TOT));
    showAt(idxFromKm(km));
  }
  cv.addEventListener('mousemove',function(e){profMove(e.clientX)});
  cv.addEventListener('mouseleave',hideCur);
  cv.addEventListener('touchmove',function(e){profMove(e.touches[0].clientX);e.preventDefault()},{passive:false});
  cv.addEventListener('touchend',hideCur);
  map.on('mousemove',function(e){
    var p=e.latlng,best=-1,bd=Infinity,cl=Math.cos(p.lat*rad);
    for(var q=0;q<ll.length;q++){
      var dy=ll[q][0]-p.lat,dx=(ll[q][1]-p.lng)*cl,d=dx*dx+dy*dy;
      if(d<bd){bd=d;best=q}
    }
    if(Math.sqrt(bd)*111<2)showAt(best);else hideCur();
  });
  map.on('mouseout',hideCur);
  window.addEventListener('resize',function(){hideCur()});
  draw();
  setTimeout(function(){map.invalidateSize();draw()},400);
});
})();
</script>
