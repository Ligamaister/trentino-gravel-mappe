  const la1=a[1]*rad, la2=b[1]*rad, dla=la2-la1, dlo=(b[0]-a[0])*rad;
  const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  cum.push(cum[i-1]+2*R*Math.asin(Math.sqrt(h)));
}
const TOT=cum[cum.length-1];

function draw(){

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  // griglia orizzontale
  const step=(emax-emin)>1500?500:250;

  // griglia verticale ogni 50 km

  ctx.beginPath(); ctx.moveTo(X(0),Y(T.ele[0]));

  for(let i=1;i<T.ele.length;i++) ctx.lineTo(X(cum[i]),Y(T.ele[i]));

}
function X(km){return PL+(W-PL-PR)*km/TOT}
function Y(e){return PT+(H-PT-PB)*(1-(e-emin)/(emax-emin))}
function idxFromKm(km){
  let lo=0,hi=cum.length-1;
  while(lo<hi){const m=(lo+hi)>>1; if(cum[m]<km)lo=m+1; else hi=m;}
  return lo;
}
let overlayIdx=-1;
function showAt(i,fromMap){
  overlayIdx=i;
  draw();
  const x=X(cum[i]), y=Y(T.ele[i]);
  ctx.strokeStyle='#2a2320'; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x,PT); ctx.lineTo(x,H-PB); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#1971c2'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1;
  tip.style.display='block'; tip.style.left=x+'px'; tip.style.top=y+'px';
  tip.textContent='km '+cum[i].toFixed(1).replace('.',',')+' · '+T.ele[i]+' m';
  cur.setLatLng(ll[i]); if(!map.hasLayer(cur)) cur.addTo(map);
}
function hide(){overlayIdx=-1; draw(); tip.style.display='none'; if(map.hasLayer(cur)) map.removeLayer(cur);}
function profMove(clientX){
  const r=cv.getBoundingClientRect();
  const km=Math.max(0,Math.min(TOT,(clientX-r.left-PL)/(W-PL-PR)*TOT));
  showAt(idxFromKm(km),false);
}

// mappa -> profilo
map.on('mousemove',e=>{
  const p=e.latlng; let best=-1,bd=Infinity;
  const cl=Math.cos(p.lat*rad);
  for(let i=0;i<ll.length;i++){
    const dy=ll[i][0]-p.lat, dx=(ll[i][1]-p.lng)*cl;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d; best=i;}
  }
  // mostra solo se entro ~2 km dal tracciato
  if(Math.sqrt(bd)*111<2) showAt(best,true); else hide();
});
map.on('mouseout',hide);
window.addEventListener('resize',()=>{hide();draw();});
