L.control.layers({"Topografica (Esri)":topoG,"Off-road / Ciclabile":cyclo,"Rilievo + curve di livello":topo,"Satellite":sat},null,{collapsed:true}).addTo(map);
let all=[];
// draw longest first so shorter ones sit on top
['lungo','medio','corto'].forEach(k=>{
  const ll=D[k].coords.map(c=>[c[1],c[0]]);
  L.polyline(ll,{color:'#fff',weight:7,opacity:.75}).addTo(map);
  L.polyline(ll,{color:cfg[k],weight:4,opacity:1}).addTo(map);
  addArrows(map,ll,cfg[k],15);
  all=all.concat(ll);
});
const s=D.corto.start;
L.circleMarker([s[1],s[0]],{radius:9,color:'#fff',weight:2,fillColor:'#111',fillOpacity:1}).addTo(map).bindPopup('Partenza / Arrivo · Rovereto');
map.fitBounds(L.latLngBounds(all),{padding:[30,30]});
</script></body></html>
