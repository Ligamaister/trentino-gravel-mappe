const COL='#e8590c';
// distanze cumulative (km)
const R=6371, rad=Math.PI/180;
const cum=[0];
for(let i=1;i<T.coords.length;i++){
  const a=T.coords[i-1], b=T.coords[i];
  const la1=a[1]*rad, la2=b[1]*rad, dla=la2-la1, dlo=(b[0]-a[0])*rad;
  const h=Math.sin(dla/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlo/2)**2;
  cum.push(cum[i-1]+2*R*Math.asin(Math.sqrt(h)));
}
const TOT=cum[cum.length-1];
// ---- mappa ----
const esritopo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
const hill=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Hillshade/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:0.35});
const topoG=L.layerGroup([esritopo,hill]);
const cyclo=L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© CyclOSM · © OpenStreetMap'});
const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap · © OpenStreetMap'});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'© Esri'});

L.control.layers({"Topografica (Esri)":topoG,"Off-road / Ciclabile":cyclo,"Rilievo + curve di livello":topo,"Satellite":sat},null,{collapsed:true}).addTo(map);
const ll=T.coords.map(c=>[c[1],c[0]]);
L.polyline(ll,{color:'#fff',weight:8,opacity:.9}).addTo(map);
const line=L.polyline(ll,{color:COL,weight:4.5,opacity:1}).addTo(map);
L.circleMarker(ll[0],{radius:8,color:'#fff',weight:2,fillColor:'#2f9e44',fillOpacity:1}).addTo(map).bindPopup('Partenza · Rovereto');
L.circleMarker(ll[ll.length-1],{radius:8,color:'#fff',weight:2,fillColor:'#e03131',fillOpacity:1}).addTo(map).bindPopup('Arrivo · Rovereto');
// pallini ogni 50 km
for(let k=50;k<TOT;k+=50){
  let i=cum.findIndex(d=>d>=k);
  L.circleMarker(ll[i],{radius:5,color:'#fff',weight:1.5,fillColor:'#2a2320',fillOpacity:1})

}

const cv=document.getElementById('prof'), tip=document.getElementById('ptip');
const ctx=cv.getContext('2d');
let W=0,H=0,PL=46,PR=14,PT=12,PB=24,emin=0,emax=0;
function draw(){
  const wrap=document.getElementById('profwrap');
  const dpr=window.devicePixelRatio||1;
  W=wrap.clientWidth; H=wrap.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  emin=Math.min(...T.ele); emax=Math.max(...T.ele);
  const pad=(emax-emin)*0.08; emin=Math.floor((emin-pad)/50)*50; emax=Math.ceil((emax+pad)/50)*50;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  // griglia orizzontale
  const step=(emax-emin)>1500?500:250;
  ctx.font='11px sans-serif';
  for(let e=Math.ceil(emin/step)*step;e<=emax;e+=step){
    const y=Y(e);
    ctx.strokeStyle='#eee8dc'; ctx.beginPath(); ctx.moveTo(PL,y); ctx.lineTo(W-PR,y); ctx.stroke();
    ctx.fillStyle='#9a8f83'; ctx.textAlign='right'; ctx.fillText(e+' m',PL-6,y+3.5);
  }
  // griglia verticale ogni 50 km
  for(let k=50;k<TOT;k+=50){
    const x=X(k);
    ctx.strokeStyle='#f2ede3'; ctx.beginPath(); ctx.moveTo(x,PT); ctx.lineTo(x,H-PB); ctx.stroke();
    ctx.fillStyle='#9a8f83'; ctx.textAlign='center'; ctx.fillText(k,x,H-8);
  }
  ctx.fillStyle='#9a8f83'; ctx.textAlign='left'; ctx.fillText('km',W-PR-18,H-8);
  // area + linea
  ctx.beginPath(); ctx.moveTo(X(0),Y(T.ele[0]));
  for(let i=1;i<T.ele.length;i++) ctx.lineTo(X(cum[i]),Y(T.ele[i]));
  ctx.lineTo(X(TOT),H-PB); ctx.lineTo(X(0),H-PB); ctx.closePath();
  const g=ctx.createLinearGradient(0,PT,0,H-PB);
  g.addColorStop(0,COL+'55'); g.addColorStop(1,COL+'0d');
  ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); ctx.moveTo(X(0),Y(T.ele[0]));
  for(let i=1;i<T.ele.length;i++) ctx.lineTo(X(cum[i]),Y(T.ele[i]));
  ctx.strokeStyle=COL; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1;
}
function X(km){return PL+(W-PL-PR)*km/TOT}
function Y(e){return PT+(H-PT-PB)*(1-(e-emin)/(emax-emin))}
function idxFromKm(km){
  let lo=0,hi=cum.length-1;
  while(lo<hi){const m=(lo+hi)>>1; if(cum[m]<km)lo=m+1; else hi=m;}
  return lo;
}
let overlayIdx=-1;
function showAt(i,fromMap){
  overlayIdx=i;
  draw();
  const x=X(cum[i]), y=Y(T.ele[i]);
  ctx.strokeStyle='#2a2320'; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(x,PT); ctx.lineTo(x,H-PB); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#1971c2'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1;
  tip.style.display='block'; tip.style.left=x+'px'; tip.style.top=y+'px';
  tip.textContent='km '+cum[i].toFixed(1).replace('.',',')+' · '+T.ele[i]+' m';
  cur.setLatLng(ll[i]); if(!map.hasLayer(cur)) cur.addTo(map);
}
function hide(){overlayIdx=-1; draw(); tip.style.display='none'; if(map.hasLayer(cur)) map.removeLayer(cur);}
function profMove(clientX){
  const r=cv.getBoundingClientRect();
  const km=Math.max(0,Math.min(TOT,(clientX-r.left-PL)/(W-PL-PR)*TOT));
  showAt(idxFromKm(km),false);
}
cv.addEventListener('mousemove',e=>profMove(e.clientX));
cv.addEventListener('mouseleave',hide);
cv.addEventListener('touchmove',e=>{profMove(e.touches[0].clientX); e.preventDefault();},{passive:false});
cv.addEventListener('touchend',hide);
// mappa -> profilo
map.on('mousemove',e=>{
  const p=e.latlng; let best=-1,bd=Infinity;
  const cl=Math.cos(p.lat*rad);
  for(let i=0;i<ll.length;i++){
    const dy=ll[i][0]-p.lat, dx=(ll[i][1]-p.lng)*cl;
    const d=dx*dx+dy*dy;
    if(d<bd){bd=d; best=i;}
  }
  // mostra solo se entro ~2 km dal tracciato
  if(Math.sqrt(bd)*111<2) showAt(best,true); else hide();
});
map.on('mouseout',hide);
window.addEventListener('resize',()=>{hide();draw();});
draw();
